# XcodeGen definition — run `xcodegen generate` in ios/ to produce
# NoFriction.xcodeproj. The .xcodeproj is generated, not checked in.
name: NoFriction
options:
  bundleIdPrefix: com.nofriction
  deploymentTarget:
    iOS: "18.0"
    # Apple Watch app: @Observable, AVAudioApplication record permission (docs/WATCH_APP.md)
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: C7GCEESE2V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  NoFriction:
    type: application
    platform: iOS
    sources:
      - NoFriction
      - Shared                                 # watch transfer contract (also in the watch app)
    dependencies:
      # Single-target watchOS app, embedded at noFriction.app/Watch/NoFrictionWatch.app
      # ("Embed Watch Content"). It ships inside the iPhone app; no separate app record.
      - target: NoFrictionWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nofriction.meetings   # same ID as the Mac app (Universal Purchase)
        # Manual App Store signing only (scripts/release-ios.sh, NF_IOS_PROFILE_UUID); empty = automatic
        PROVISIONING_PROFILE_SPECIFIER: "$(NF_IOS_PROFILE_SPECIFIER)"
        PRODUCT_NAME: noFriction
        INFOPLIST_KEY_CFBundleDisplayName: noFriction
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark   # dark-only app; system UI (alerts, launch) matches
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Usage strings: audio, photos and transcripts stay on the device; meeting
        # text goes only to the AI provider the user picks, when they use an AI feature.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "noFriction records your meetings so it can transcribe them. The audio is stored and transcribed on this device and never uploaded."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "noFriction turns your recordings into text with speech recognition on this device. Audio never leaves it; transcript text goes only to the AI provider you choose, when you use an AI feature."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "noFriction reads your calendar to name each recording and list who attended. It never changes your calendar."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of slides, whiteboards or screens during a meeting. Photos stay on this device."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Add screenshots or photos from your library to a meeting. They stay on this device."
    info:
      path: NoFriction/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        # Dark launch screen (no white flash before the first frame)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Optional: AI on the user's explicitly configured server on the LAN
        NSLocalNetworkUsageDescription: "noFriction connects to your AI endpoint on the local network only if you enter its address in Settings."
        NSAppTransportSecurity:
          # http:// only to local hosts (IPs, .local, unqualified names). Never NSAllowsArbitraryLoads.
          NSAllowsLocalNetworking: true
  # Apple Watch app (docs/WATCH_APP.md): records on the watch, sends the
  # file to the iPhone, which imports and transcribes it on-device.
  NoFrictionWatch:
    type: application
    platform: watchOS
    sources:
      - NoFrictionWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nofriction.meetings.watchkitapp
        PRODUCT_NAME: NoFrictionWatch
        INFOPLIST_KEY_CFBundleDisplayName: noFriction
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES                      # archived inside the iPhone app, not on its own
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nofriction.meetings
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "noFriction records meetings on your watch and sends the audio to noFriction on your iPhone, where it is transcribed on the device. It is deleted from the watch once your iPhone has it."
        PROVISIONING_PROFILE_SPECIFIER: "$(NF_WATCH_PROFILE_SPECIFIER)"
    info:
      path: NoFrictionWatch/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: noFriction
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nofriction.meetings
        WKRunsIndependentlyOfCompanionApp: false
        # Keeps a recording started in the foreground going with the wrist down
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false

  NoFrictionWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [NoFrictionWatchTests]
    dependencies:
      - target: NoFrictionWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NoFrictionWatch.app/NoFrictionWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NoFrictionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NoFrictionTests
      # Link-detection cases shared with the Mac tests (docs/LINKS.md)
      - path: ../src-tauri/src/meeting_links/detection_cases.json
        buildPhase: resources
    dependencies:
      - target: NoFriction
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/noFriction.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/noFriction"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NoFrictionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NoFrictionUITests
      - path: NoFriction.storekit
        buildPhase: resources
    dependencies:
      - target: NoFriction
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoFriction

schemes:
  NoFriction:
    build:
      targets:
        NoFriction: all
        NoFrictionTests: [test]
        NoFrictionUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing for Debug runs only; Release/TestFlight use the App Store
      storeKitConfiguration: NoFriction.storekit
    test:
      config: Debug
      targets: [NoFrictionTests, NoFrictionUITests]
    archive:
      config: Release
  NoFrictionWatch:
    build:
      targets:
        NoFrictionWatch: all
        NoFrictionWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NoFrictionWatchTests]
    archive:
      config: Release
