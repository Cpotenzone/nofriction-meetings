# XcodeGen definition — run `xcodegen generate` in ios/ to produce
# NoFriction.xcodeproj. The .xcodeproj is generated, not checked in.
name: NoFriction
options:
  bundleIdPrefix: com.nofriction
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: C7GCEESE2V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NoFriction:
    type: application
    platform: iOS
    sources:
      - NoFriction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nofriction.meetings   # same ID as the Mac app (Universal Purchase)
        PRODUCT_NAME: noFriction
        INFOPLIST_KEY_CFBundleDisplayName: noFriction
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "noFriction records the meeting so it can transcribe it on this device. Audio stays on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is transcribed on this device. Audio never leaves it."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "noFriction matches each recording to your calendar to name the meeting and list who attended."
        INFOPLIST_KEY_NSCameraUsageDescription: "Snap slides, whiteboards or screens during a meeting."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Add screenshots or photos to a meeting."
    info:
      path: NoFriction/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        # Optional: AI on the user's own Ollama / LM Studio server on the LAN
        NSLocalNetworkUsageDescription: "noFriction connects to an AI server on your network (such as Ollama or LM Studio) only if you add one in Settings."
        NSAppTransportSecurity:
          # http:// only to local hosts (IPs, .local, unqualified names). Never NSAllowsArbitraryLoads.
          NSAllowsLocalNetworking: true
  NoFrictionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NoFrictionTests]
    dependencies:
      - target: NoFriction
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/noFriction.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/noFriction"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NoFrictionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoFrictionUITests]
    dependencies:
      - target: NoFriction
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoFriction

schemes:
  NoFriction:
    build:
      targets:
        NoFriction: all
        NoFrictionTests: [test]
        NoFrictionUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing for Debug runs only; Release/TestFlight use the App Store
      storeKitConfiguration: NoFriction.storekit
    test:
      config: Debug
      targets: [NoFrictionTests, NoFrictionUITests]
    archive:
      config: Release
