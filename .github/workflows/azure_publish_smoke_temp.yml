name: Temporary Azure publish smoke

on:
  push:
    branches:
      - codex/azure-static-publish-20261029
    paths:
      - .github/workflows/azure_publish_smoke_temp.yml
      - infra/site/azure-deploy.sh

permissions:
  id-token: write
  contents: read

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: a20f5b7b-aa5b-4b36-8350-617ab39eb432
          tenant-id: 3c3f26f9-e1a4-4776-aff2-2a8a16ee453e
          subscription-id: e242106d-31bc-406c-a8aa-d19cfbe29261

      - name: Publish with the release film intentionally absent
        env:
          FILM_DIR: /tmp/nofriction-intentionally-missing-film
          AZURE_STORAGE_ACCOUNT: canofrictione242106d
        run: bash infra/site/azure-deploy.sh

      - name: Verify the final live manifest
        run: |
          python3 infra/site/azure_manifest.py verify \
            --manifest infra/site/nofriction-s3-manifest-20261030.json \
            --base-url https://canofrictione242106d.z21.web.core.windows.net/ \
            --output /tmp/nofriction-azure-final.json
          jq -e '.passed == true and .object_count == 97 and .passed_count == 97 and .total_bytes == 18738954' \
            /tmp/nofriction-azure-final.json >/dev/null
